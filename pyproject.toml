[project]
name = "agent-ready-chess"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.143.2",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "attrs",
    "python-dateutil",
]

[dependency-groups]
dev = [
    "openapi-python-client>=0.29.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "sdk"]
asyncio_mode = "auto"
